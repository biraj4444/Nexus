<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Admin Login — NexusVault</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-box">
    <div class="login-header">
      <div class="logo">⬡</div>
      <h1>NexusVault Admin</h1>
      <p>Secure administrative access</p>
    </div>
    <div class="login-body">
      {% if error %}
      <div class="alert alert-err">{{ error }}</div>
      {% endif %}
      <div class="login-warning">🔐 This area is restricted to administrators only.</div>
      <form method="POST">
        <div class="form-group">
          <label>Username</label>
          <input class="form-control" name="username" autocomplete="username" placeholder="admin" autofocus required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input class="form-control" type="password" name="password" autocomplete="current-password" placeholder="••••••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;padding:12px;">
          Sign In →
        </button>
      </form>
      <p style="margin-top:20px;font-size:11px;color:var(--text-muted);text-align:center;">
        Default credentials: <code style="background:var(--bg-raised);padding:2px 6px;">admin</code> / <code style="background:var(--bg-raised);padding:2px 6px;">NexusAdmin@2024</code>
      </p>
    </div>
  </div>
</div>
</body>
</html>
