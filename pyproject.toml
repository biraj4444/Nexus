[project]
name = "nexusvault"
version = "0.1.0"
description = "NexusVault collection platform"
requires-python = ">=3.13"
dependencies = [
    "flask",
    "werkzeug",
    "python-dotenv",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "public_site", "admin_site"]
